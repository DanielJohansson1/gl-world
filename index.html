<html lang="en">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#285c34">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
@font-face{font-family:'Press Start 2P';src:url(fonts/press-start-2p.woff2) format('woff2');font-display:swap}
:root{--bg:#6b4527;--panel:#f2d9a1;--field:#fff6dc;--fg:#3b2412;--mid:#6b4423;--hd:#f7e3b0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1a0e;--panel:#cfae6f;--field:#e8d3a0;--hd:#e8c98a}}
:root[data-theme="dark"]{--bg:#2a1a0e;--panel:#cfae6f;--field:#e8d3a0;--hd:#e8c98a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg) repeating-linear-gradient(90deg,transparent 0 46px,rgba(0,0,0,.14) 46px 48px);color:var(--fg);font:10px/1.7 'Press Start 2P',ui-monospace,monospace;image-rendering:pixelated}
main{max-width:480px;margin:0 auto;padding:14px 14px 90px}
h1,h2{color:var(--hd);text-shadow:2px 2px 0 var(--fg)}
h1{font-size:14px;margin:4px 0 12px}
h2{font-size:10px;margin:18px 0 8px}
.box{border:4px solid var(--fg);background:var(--panel);padding:10px;box-shadow:inset 0 0 0 3px #e4b86a,3px 3px 0 rgba(0,0,0,.35)}
button,input,select{font:inherit;color:var(--fg);background:var(--field);border:3px solid var(--fg);padding:8px;border-radius:0}
button{cursor:pointer;box-shadow:2px 2px 0 var(--fg)}
button:active{transform:translate(2px,2px);box-shadow:none}
button:disabled{opacity:.5;cursor:default}
h1{display:flex;justify-content:space-between;align-items:center}
.cog{background:transparent;border:0;box-shadow:none;padding:2px}
.cog svg{width:30px;height:30px;fill:var(--hd);display:block}
@keyframes bob{0%,49%{transform:translateY(0)}50%,100%{transform:translateY(-1px)}}
.bob{animation:bob 1s infinite}
.noanim .bob{animation:none}
@media (prefers-reduced-motion:reduce){.bob{animation:none}}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:96px;padding:8px;border:3px solid var(--fg);background:var(--panel);box-shadow:inset 0 0 0 3px #e4b86a,2px 2px 0 var(--fg);text-align:center}
.glow{background:#ffe27a;color:var(--fg);animation:glow .9s steps(2) infinite;box-shadow:2px 2px 0 var(--fg),0 0 0 4px #f0c030}
@keyframes glow{0%{background:#ffe27a;box-shadow:2px 2px 0 var(--fg),0 0 0 4px #f0c030}50%{background:#fffbe0;box-shadow:2px 2px 0 var(--fg),0 0 0 4px #fff3a0}}
.noanim .glow{animation:none}
@media (prefers-reduced-motion:reduce){.glow{animation:none}}
.tile{position:relative}
.tile:has(> .spk){background:#ffe27a;box-shadow:inset 0 0 0 3px #f0c030,0 0 0 4px #f0c030,2px 2px 0 var(--fg);animation:tileglow .9s steps(2) infinite}
@keyframes tileglow{0%{background:#ffe27a;box-shadow:inset 0 0 0 3px #f0c030,0 0 0 4px #f0c030,2px 2px 0 var(--fg)}50%{background:#fffbe0;box-shadow:inset 0 0 0 3px #fff3a0,0 0 0 4px #fff3a0,2px 2px 0 var(--fg)}}
.noanim .tile:has(> .spk){animation:none}
@media (prefers-reduced-motion:reduce){.tile:has(> .spk){animation:none}}
.boss{position:relative;width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:8px;background:var(--panel);border:4px solid var(--fg);box-shadow:inset 0 0 0 3px #e4b86a,3px 3px 0 rgba(0,0,0,.35)}
.boss .bspr{width:56px;height:56px;flex:none;background:var(--field);border:2px solid var(--fg)}
.boss .bi{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.boss .bi b{font-weight:normal;font-size:9px}
.boss small{font-size:8px;color:var(--mid);line-height:1.5}
.hpbar{display:block;height:10px;border:2px solid var(--fg);background:#5a2a22}
.hpbar i{display:block;height:100%;background:#e05a47;box-shadow:inset 0 2px 0 #ff8a7a;transition:width .4s}
.hpbar.big{width:100%;height:12px}
.hpn{font-size:9px;flex:none}
.boss.beaten .bspr{filter:grayscale(1);opacity:.6}
.boss.beaten .hpn{color:#2f7a1f}
.boss.hurt .bspr{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.dmg{position:absolute;left:30px;top:6px;color:#c23b2c;font-size:11px;text-shadow:1px 1px 0 #fff6dc;animation:gain 1.4s ease-out forwards;pointer-events:none}
.shelf{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;width:100%;padding:6px;background:#8a5a32;border:3px solid var(--fg);box-shadow:inset 0 -4px 0 #6b4423}
.tro{display:flex;flex-direction:column;align-items:center;gap:2px}
.tro .tsp{width:36px;height:36px}
.tro small{font-size:8px;color:#fff1c4}
.tro.none .tsp{filter:brightness(0) opacity(.35)}
.card .bbig{width:128px;height:128px}
.card .gone{filter:grayscale(1);opacity:.6}
.noanim .boss.hurt .bspr{animation:none}
@media (prefers-reduced-motion:reduce){.boss.hurt .bspr{animation:none}.dmg{animation:none}}
.spr{position:relative;flex:none;line-height:0}
.say{position:absolute;top:2px;left:58px;width:max-content;max-width:150px;background:#fffaf0;color:var(--fg);border:3px solid var(--fg);padding:6px 8px;font-size:9px;line-height:1.5;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:3;box-shadow:2px 2px 0 rgba(0,0,0,.3)}
.say.show{opacity:1;transform:none}
.say::after{content:'';position:absolute;left:10px;bottom:-9px;width:6px;height:6px;background:#fffaf0;border:3px solid var(--fg);border-top:0;border-left:0;transform:skewY(45deg)}
@media (prefers-reduced-motion:reduce){.say{transition:none}}
.tw{position:relative;display:flex}
.tw .tile{flex:1}
.ib{position:absolute;top:7px;left:7px;width:26px;height:26px;padding:0;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:1px 1px 0 var(--fg);border-width:2px}
.ovl{position:fixed;inset:0;background:rgba(30,18,8,.6);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.card{width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.card .cpic{width:112px;height:112px;border:3px solid var(--fg);background:var(--field)}
.card h3{margin:0;font-size:12px}
.card small{font-size:9px;color:var(--mid)}
.card p{margin:0}
.card .lbl{margin-top:8px;font-size:9px;color:var(--mid)}
.card button{margin-top:12px;width:100%}
.hb{transform-box:fill-box;transform-origin:50% 60%;animation:beat 4s steps(1) infinite}
@keyframes beat{0%,100%{transform:none}84%{transform:scale(1.12)}88%{transform:none}92%{transform:scale(1.08)}96%{transform:none}}
.noanim .hb{animation:none}
.hb{transition:opacity .3s}.spr:has(.say.show) .hb{opacity:0}
@media (prefers-reduced-motion:reduce){.hb{animation:none}}
.card button.ghost{margin-top:4px;background:transparent;box-shadow:none}
.card .sgpts{color:var(--c)}
.spk{display:inline-block;width:4px;height:4px;background:#f0c030;box-shadow:4px 0 #f0c030,-4px 0 #f0c030,0 4px #f0c030,0 -4px #f0c030;margin:0 8px;animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.noanim .spk{animation:none}
@media (prefers-reduced-motion:reduce){.spk{animation:none}}
.tabs{display:flex;gap:8px;margin:14px 0 10px}
.tabs button{flex:1;background:rgba(0,0,0,.25);color:var(--hd);border-color:var(--fg);box-shadow:none}
.tabs button[aria-pressed="true"]{background:var(--field);color:var(--fg);box-shadow:inset 0 0 0 3px #e4b86a,2px 2px 0 var(--fg)}
.tile svg.qth{background:var(--field)}
.tile[aria-pressed="false"] svg.qth{opacity:.45}
.tabs button{padding:8px 4px}
.tile svg.thumb{width:72px;height:72px;border:2px solid var(--fg)}
.tile svg{width:40px;height:40px}
.tile small{font-size:8px;color:var(--mid)}
.tile.locked{background:var(--bg);box-shadow:none;color:var(--hd);opacity:.7}
.tile.locked b{font-size:20px}
:focus-visible{outline:3px dashed var(--fg);outline-offset:2px}
.hero{display:flex;gap:12px;align-items:center}
svg.sprite{width:150px;height:150px;flex:none;border:3px solid var(--fg)}
.stats{flex:1;display:grid;gap:10px}
.s-STR{--c:#c0392b}.s-INT{--c:#2f6fd0}.s-CHA{--c:#d9658f}.s-DIS{--c:#3f9b3f}
.stat .row{display:flex;justify-content:space-between}
.seg{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;margin:3px 0}
.seg i{height:9px;border:2px solid var(--fg);background:var(--field)}
.seg i.on{background:var(--c)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:15px;padding:0 2px;margin-left:5px;border:2px solid var(--fg);font-size:8px;font-weight:normal;vertical-align:middle;background:var(--field)}
.tier1 .badge{background:#d58b4a}.tier2 .badge{background:#c9d1da}.tier3 .badge,.tier4 .badge{background:#e8bf4f}
.tier4 .badge{box-shadow:0 0 0 2px #fff1a8}
.tier1 .seg i{border-color:#a0612a}.tier2 .seg i{border-color:#8f9aa6}.tier3 .seg i,.tier4 .seg i{border-color:#b8860b}
.trial{font-size:8px;line-height:1.5;color:#8a6200;background:none;border:0;box-shadow:none;padding:2px 0;width:100%;text-align:left;display:flex;align-items:center;gap:0}
.trial .ti{margin-left:auto;width:14px;height:14px;border:2px solid #8a6200;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:normal}
.tbox{display:flex;gap:4px;justify-content:center;margin:4px 0}.tbox i{width:26px;height:26px;border:3px solid var(--fg);background:var(--field);display:flex;align-items:flex-end;justify-content:center}.tbox i.on{background:var(--c)}.tbox i.pre{opacity:.35}.tbox u{text-decoration:none;font-size:8px;margin-bottom:-18px;color:var(--mid)}.tbox:not(.cnt){margin-bottom:16px}
.lock{display:inline-block;width:7px;height:7px;background:#8a6200;margin-right:4px;vertical-align:baseline}
.prog{height:6px;background:var(--field);border:2px solid var(--fg)}
.prog b{display:block;height:100%;background:var(--c)}
.task{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:2px dashed var(--mid);position:relative;transition:opacity .35s}
.task.won{background:#cfe9a6;box-shadow:-8px 0 0 #cfe9a6,8px 0 0 #cfe9a6}
.task.won .chk{background:#4caf50!important;color:#fff;opacity:1}
.task.leaving{opacity:0}
.gain{position:absolute;right:46px;top:50%;font-size:10px;color:#2f7a1f;text-shadow:1px 1px 0 #fff6dc;white-space:nowrap;pointer-events:none;animation:gain 1.6s ease-out forwards}
@keyframes gain{0%{opacity:0;transform:translateY(-20%)}15%{opacity:1;transform:translateY(-60%)}75%{opacity:1;transform:translateY(-90%)}100%{opacity:0;transform:translateY(-140%)}}
.noanim .gain{animation:none;transform:translateY(-50%)}
@media (prefers-reduced-motion:reduce){.gain{animation:none;transform:translateY(-50%)}.task{transition:none}}
.task:last-child{border:0}
.task .n{flex:1;word-break:break-word}
.task small{display:block;font-size:9px;color:var(--mid)}
.trhead{width:100%;display:flex;align-items:center;gap:10px;text-align:left;color:var(--fg);background:#e8c98a;border:3px solid var(--fg);box-shadow:2px 2px 0 var(--fg);padding:8px 10px;margin:8px 0}
.task.trhead,.task.trhead:last-child{border:3px solid var(--fg)}
.trhead .arw{width:14px;height:18px;flex:none;fill:var(--fg);transition:transform .15s}
.trhead[aria-expanded="true"] .arw{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){.trhead .arw{transition:none}}
.trsum{display:flex;align-items:center;justify-content:center;border:3px solid var(--fg);font-size:10px}
.task.sub{padding-left:12px;border-left:4px solid var(--mid)}
.chk{width:34px;height:34px;padding:0;flex:none;background:#8fcf6a}
.x{padding:4px 7px;flex:none;box-shadow:none}
.qb{flex:none;width:36px;height:36px;padding:3px;box-shadow:1px 1px 0 var(--fg);border-width:2px;display:flex;align-items:center;justify-content:center}.qb svg{width:26px;height:26px}
.edt{flex:none;border:2px solid var(--fg);padding:3px 5px;font-size:8px;color:var(--fg)}
.card .danger{color:#a8263f}
body.inworld main{max-width:none;padding:0}
#wv{position:fixed;left:0;right:0;top:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));background:#2f6b2a;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wc{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}
#whud{position:absolute;left:8px;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
#whud b{align-self:flex-start;background:rgba(59,36,22,.85);color:var(--hd);padding:5px 8px;font-size:9px;font-weight:normal;border:2px solid var(--fg)}
#wquest{align-self:flex-start;background:rgba(242,217,161,.95);color:var(--fg);padding:6px 8px;font-size:8px;line-height:1.6;border:2px solid var(--fg);max-width:85%}#wquest:empty{display:none}
#wjoy{position:fixed;width:84px;height:84px;margin:-42px 0 0 -42px;border:3px solid rgba(255,255,255,.55);border-radius:50%;background:rgba(0,0,0,.15);pointer-events:none;z-index:5}
#wjoy i{position:absolute;left:24px;top:24px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.75);border:3px solid rgba(59,36,22,.6)}
#wact{position:absolute;right:14px;bottom:18px;min-width:84px;padding:14px 10px;font-size:11px;background:#ffd36b;border:4px solid var(--fg);box-shadow:3px 3px 0 var(--fg);z-index:4}
#wdlg{position:absolute;left:8px;right:8px;bottom:10px;display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:4px solid var(--fg);box-shadow:inset 0 0 0 3px #e4b86a,3px 3px 0 rgba(0,0,0,.4);padding:10px;z-index:6;min-height:96px}
#wdlg .wport{flex:none;width:72px;height:96px;background:var(--field);border:3px solid var(--fg);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}#wdlg .wport canvas{width:72px;height:auto;image-rendering:pixelated}
#wdlg .wtxt{flex:1;display:flex;flex-direction:column;gap:6px}#wdlg b{font-size:9px;color:var(--mid);font-weight:normal}#wdlg p{margin:0;font-size:10px;line-height:1.7}#wdlg small{align-self:flex-end;font-size:7px;color:var(--mid);animation:wflash2 1s steps(2) infinite}
#wdlg.quest p{color:#8a6200}
#wdlg .wch{display:flex;gap:8px;flex-wrap:wrap}#wdlg .wch button{flex:1;min-width:100px;padding:10px 6px;font-size:9px}#wdlg .wch button:first-child{background:#ffd36b}
.task.mq .n small{color:#8a5a2a}.task.mq{border-left:4px solid #e0a64e;padding-left:8px}.task.mq.rep .n small{color:#2f7a1f}.task.mq.rep{background:#eef7d8}
.mtag{flex:none;border:2px solid #b0742c;color:#8a5a2a;padding:3px 5px;font-size:8px}.rlport canvas{width:84px;image-rendering:pixelated}
#wdlg[hidden],#wact[hidden],#wjoy[hidden]{display:none}

.fxc{position:fixed;inset:0;pointer-events:none;z-index:60;image-rendering:pixelated}
.fxflash{position:fixed;pointer-events:none;z-index:55;background:#fff;animation:fxf .45s steps(3) forwards}
@keyframes fxf{from{opacity:.9}to{opacity:0}}
.fxgold{position:fixed;inset:0;pointer-events:none;z-index:55;background:#fff1a8;animation:fxf .6s steps(4) forwards}
.fxban{position:fixed;left:50%;top:120px;transform:translateX(-50%);z-index:58;pointer-events:none;background:var(--fg);color:var(--hd);border:4px solid #f0c030;box-shadow:0 0 0 3px var(--fg),4px 4px 0 rgba(0,0,0,.4);padding:10px 16px;text-align:center;font-size:16px;letter-spacing:1px;text-shadow:2px 2px 0 #000;white-space:nowrap;animation:fxin .3s steps(4)}
.fxban small{display:block;font-size:10px;margin-top:6px;color:#fff1a8;text-shadow:none}
.fxban.out{animation:fxout .4s steps(4) forwards}
@keyframes fxin{from{transform:translate(-50%,-30px) scale(.6);opacity:0}to{transform:translateX(-50%);opacity:1}}
@keyframes fxout{to{transform:translate(-50%,-20px);opacity:0}}
.stat.pulse .seg i.on,.stat.pulse .prog b{animation:fxpulse .25s steps(2) 4}
@keyframes fxpulse{50%{filter:brightness(1.6)}}
.fxtier{z-index:50}.fxtier .card{border-color:#b8860b;box-shadow:inset 0 0 0 3px #f0c030,0 0 0 3px #f0c030,3px 3px 0 rgba(0,0,0,.35);animation:bdrop .4s steps(5)}
.fxtier .tpk{font-size:14px;color:#b8860b}.fxtier h3{line-height:1.8}
.tpdog{display:flex;align-items:center;gap:10px;border-top:2px dashed var(--mid);padding-top:8px;width:100%;justify-content:center}.tpdog .cpic{width:64px;height:64px}.tpdog b{color:#b0742c}
.fxboss .card{border-color:#3b0d0a;box-shadow:inset 0 0 0 3px #b3261e,0 0 0 3px #b3261e,3px 3px 0 rgba(0,0,0,.35)}.fxboss .tpk{color:#b3261e}
.fxspirit .card{border-color:#8a5a2a;box-shadow:inset 0 0 0 3px #e0a64e,0 0 0 3px #e0a64e,3px 3px 0 rgba(0,0,0,.35)}.fxspirit .tpk{color:#b0742c}.fxspirit .cpic{background:#cfe8a8}

.bkconf{border:3px dashed var(--fg);padding:10px;display:grid;gap:6px;text-align:center}.bkconf p{margin:0}.bkconf .ghost{background:transparent;box-shadow:none}.bklast{font-size:9px;color:var(--mid);text-align:center}
.bkst{display:grid;grid-template-columns:1fr 1fr;gap:6px}.bkst span{display:flex;align-items:center;gap:6px;border:2px solid var(--fg);background:var(--field);padding:5px 6px}.bkst b{width:9px;height:9px;flex:none;background:var(--c);border:2px solid var(--fg)}.bkst i{font-style:normal;margin-left:auto}
.ovl.warn{background:rgba(25,0,0,.85);flex-direction:column;cursor:pointer}
.warnbar{width:100%;max-width:330px;background:#b3261e;color:#fff1e8;border:4px solid #3b0d0a;box-shadow:0 0 0 3px #ff6b5a;padding:16px 10px;text-align:center;font-size:13px;line-height:2;animation:wflash .5s steps(2) infinite,shake .35s steps(4) 4}
.warn .tap{color:#ffd6cf;margin-top:18px;font-size:10px;animation:wflash2 1.2s steps(2) infinite}
@keyframes wflash{50%{background:#6e120e;box-shadow:0 0 0 3px #b3261e}}
@keyframes wflash2{50%{opacity:.35}}
@keyframes shake{0%,100%{transform:none}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,-2px)}}
.card.bossin{border-color:#3b0d0a;box-shadow:inset 0 0 0 3px #b3261e,0 0 0 3px #b3261e,3px 3px 0 rgba(0,0,0,.35);animation:bdrop .4s steps(5)}
.card.bossin .bnew{color:#b3261e;font-size:10px}

.noanim .warnbar,.noanim .warn .tap,.noanim .bossin{animation:none}
@media (prefers-reduced-motion:reduce){.warnbar,.warn .tap,.bossin{animation:none}}

.help{padding:6px 12px}.help section{padding:10px 0;border-bottom:2px dashed var(--mid)}.help section:last-child{border:0}.help h3{margin:0 0 6px;font-size:10px}.help ul{margin:0;padding:0;list-style:none}.help li{position:relative;padding-left:14px;margin:5px 0;font-size:9px;line-height:1.9}.help li::before{content:'';position:absolute;left:0;top:5px;width:6px;height:6px;background:var(--mid)}.help b{font-weight:normal;color:var(--mid)}
.sqt{display:flex;justify-content:space-between;align-items:center;background:var(--field);color:var(--fg);box-shadow:none}

    for (let x = 15; x < W; x++) { const h = 14 + Math.round(2 * Math.sin(x / 3)); R(x, h, 1, 30 - h, '#3f8f3a'); if (x % 3 === 0) P(x, h + 1, '#5cb04f'); }   // hedge

function charLayers(str, int, cha, gear, pose) {
  pose = pose || '';
  const run = /^run[0-3]$/.test(pose) ? +pose[3] : -1, walk = /^(walk|back)[01]$/.test(pose) ? +pose.slice(-1) : -1, bk = /^back[01]?$/.test(pose);   // bk = seen from behind (walking up)   // world movement frames (run = facing right)
  const W = 44, H = 44, FB = 40, CX = (gear && gear.pet) ? ((gear.tiers && gear.tiers.STR) ? 17 : 19) : 22; // FB = feet bottom row, CX = centre (between CX-1 and CX)
  const tier = l => l >= 6 ? 2 : l >= 3 ? 1 : 0;
  const sT = tier(str), iT = tier(int), cT = tier(cha), TT = (gear && gear.tiers) || {}, stT = TT.STR || 0, inT = TT.INT || 0, chT = TT.CHA || 0;
  const aura = ['STR', 'INT', 'CHA', 'DIS'].every(k => (TT[k] || 0) >= 1);
  const C = {
    o: '#3b2416',                                      // outline (dark warm brown)
    s: '#f3c4a2', S: '#d99b7e', K: '#ffe0c9', b: '#ef9b8f', // skin
    h: '#a2703c', H: '#704426', L: '#d2a467',          // hair
    e: '#2a2230', g: '#ffffff', m: '#a5433b', t: '#fffaf2', // eyes / mouth
    w: '#f7f4ee', W: '#cbc5ba',                        // white tee
    R: '#c23b2c', Q: '#8c2a1f', r: '#ec8a6c',          // red shirt (gear)
    p: '#4a5774', q: '#323b55',                        // pants
    f: '#7a4c2a', F: '#4e2f1a',                        // shoes
    v: '#6a44ad', V: '#47297a', y: '#e8bf4f', Y: '#fff1a8', // wizard hat
    n: '#fffaf0', N: '#e2d9c5', k: '#e5607e',          // bubble
    G: '#d4a63a', E: '#1f1a27', D: '#6d6a8a', P: '#f08ca8', Z: '#5c9e45', u: '#b8860b', B: '#7cc4f0', // accessories
    X: '#3b3f5c', U: '#272a40', M: '#23395b', O: '#1e1e24', J: '#9aa5b1', I: '#3d6fb5', A: '#284f8a' // boss loot
  };
  const grid = () => Array.from({ length: H }, () => Array(W).fill(null));
  const body = grid(), bub = grid();
  const put = (G, x, y, c) => { if (x >= 0 && y >= 0 && x < W && y < H) G[y][x] = c; };
  const rect = (G, x, y, w, h, c) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) put(G, x + i, y + j, c); };
  const outline = G => {
    const add = [];
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (!G[y][x]) {
      if ([[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => { const r = G[y + dy]; return r && r[x + dx] && r[x + dx] !== 'o'; })) add.push([x, y]);
    }
    add.forEach(([x, y]) => G[y][x] = 'o');
  };

  const head = gear && gear.head, torso = gear && gear.torso, naked = torso === 'shirtless', shirt = torso === 'shirt';
  const hood = torso === 'hoodie', tank = torso === 'tank';
  const sweater = torso === 'sweater', gi = torso === 'gi', cape = torso === 'cape';
  const sb = shirt ? 'R' : hood ? 'X' : sweater ? 'P' : gi ? 'n' : tank ? '#9aa5b1' : 'w', ss = shirt ? 'Q' : hood ? 'U' : sweater ? 'k' : gi ? 'N' : tank ? '#6d7884' : 'W';

  // ---- dimensions by tier
  const TW = stT >= 1 ? 16 : [10, 12, 14][sT];      // torso width (broader from strength tier II)
  const AW = stT >= 1 ? 5 : [2, 3, 4][sT];         // arm width
  const LW = stT >= 1 ? 6 : [4, 5, 6][sT];         // leg block half-width (wider stance at tier III)
  const HW = [14, 16, 18][iT];      // head width
  const HH = [12, 13, 14][iT];      // head height
  const tL = CX - TW / 2, tR = CX + TW / 2 - 1;
  const shirtTop = FB - 13, pantsTop = FB - 7, shoeTop = FB - 1;
  const headBot = shirtTop - 1, top = headBot - HH + 1, hL = CX - HW / 2, hR = CX + HW / 2 - 1;

  // ---- legs / pants
  if (run >= 0) {                                                   // side run cycle: far leg darker, near leg on top
    const hipW = Math.max(6, LW * 2 - 2), lw = Math.max(3, LW - 2);
    rect(body, CX - hipW / 2, pantsTop, hipW, 2, 'p'); rect(body, CX - hipW / 2, pantsTop, hipW, 1, 'q');
    const F = [[5, -5, 0, 0], [0, 2, 3, 0], [-5, 5, 0, 0], [2, 0, 0, 3]][run];          // near foot dx, far foot dx, near lift, far lift
    const leg = (fdx, lift, c) => {
      const hx = CX - Math.floor(lw / 2), fx = CX - Math.floor(lw / 2) + fdx, fy = shoeTop - 1 - lift, n = Math.max(1, fy - (pantsTop + 2));
      for (let i = 0; i <= n; i++) { const x = Math.round(hx + (fx - hx) * i / n); rect(body, x, pantsTop + 2 + i, lw, 1, c); }
      rect(body, fx, fy + 1, lw + 2, 2, 'f'); rect(body, fx, fy + 2, lw + 2, 1, 'F');
    };
    leg(F[1], F[3], 'q'); leg(F[0], F[2], 'p');
  } else {
  rect(body, CX - LW, pantsTop, LW * 2, 6, 'p');
  for (let y = pantsTop + 3; y < pantsTop + 6; y++) { body[y][CX - 1] = null; body[y][CX] = null; }
  for (let y = pantsTop; y < pantsTop + 6; y++) { put(body, CX + LW - 1, y, 'q'); if (y >= pantsTop + 3) put(body, CX - 2, y, 'q'); }
  rect(body, CX - LW, pantsTop, LW * 2, 1, 'q'); // waistband shadow
  // shoes (walking up/down lifts one foot)
  const lL = walk === 0 ? 1 : 0, lR = walk === 1 ? 1 : 0;
  rect(body, CX - LW - 1, shoeTop - lL, LW, 2, 'f'); rect(body, CX + 1, shoeTop - lR, LW, 2, 'f');
  rect(body, CX - LW - 1, shoeTop + 1 - lL, LW, 1, 'F'); rect(body, CX + 1, shoeTop + 1 - lR, LW, 1, 'F');
  if (lL) for (let x = CX - LW - 1; x < CX - 1; x++) put(body, x, shoeTop + 1, null); if (lR) for (let x = CX + 1; x < CX + LW + 1; x++) put(body, x, shoeTop + 1, null);
  }

  // ---- torso
  if (naked && bk) {                                                  // bare back: shoulder blades + spine
    rect(body, tL, shirtTop, TW, 7, 's'); rect(body, tR, shirtTop, 1, 7, 'S');
    rect(body, CX - LW, pantsTop + 1, LW * 2, 1, 'q');
    rect(body, tL + 2, shirtTop + 2, TW / 2 - 4, 1, 'S'); rect(body, CX + 2, shirtTop + 2, TW / 2 - 4, 1, 'S');
    put(body, tL + 2, shirtTop + 1, 'K'); put(body, CX + 2, shirtTop + 1, 'K');
    for (let y = shirtTop + 1; y < shirtTop + 7; y++) put(body, CX - 1, y, 'S');
    put(body, tL + 1, shirtTop + 4, 'S'); put(body, tL + 2, shirtTop + 5, 'S'); put(body, tR - 1, shirtTop + 4, 'S'); put(body, tR - 2, shirtTop + 5, 'S');
  } else if (naked) {
    rect(body, tL, shirtTop, TW, 7, 's');
    rect(body, tR, shirtTop, 1, 7, 'S');
    rect(body, CX - LW, pantsTop + 1, LW * 2, 1, 'q');                 // waistband sits lower
    rect(body, tL + 1, shirtTop + 1, TW / 2 - 2, 1, 'S');              // pecs
    rect(body, CX + 1, shirtTop + 1, TW / 2 - 2, 1, 'S');
    put(body, tL + 2, shirtTop, 'K'); put(body, CX + 1, shirtTop, 'K');
    for (let y = shirtTop + 2; y < shirtTop + 7; y++) put(body, CX - 1, y, 'S'); // midline
    [shirtTop + 3, shirtTop + 5].forEach(y => rect(body, CX - 3, y, 6, 1, 'S')); // six-pack lines
    [shirtTop + 2, shirtTop + 4, shirtTop + 6].forEach(y => { put(body, CX - 3, y, 'K'); put(body, CX, y, 'K'); });
  } else {
  rect(body, tL, shirtTop, TW, 6, sb);
  rect(body, tR - 1, shirtTop, 2, 6, ss);
  rect(body, tL, shirtTop + 5, TW, 1, ss);
  if (shirt) rect(body, tL, shirtTop + 3, TW - 2, 1, 'r');
  if (hood && bk) { rect(body, CX - 4, shirtTop, 8, 3, 'U'); rect(body, CX - 3, shirtTop, 6, 2, 'X'); rect(body, CX - 2, shirtTop + 3, 4, 1, 'U'); put(body, CX - 4, shirtTop + 2, sb); put(body, CX + 3, shirtTop + 2, sb); }
  else if (hood) { rect(body, CX - 4, shirtTop, 8, 1, 'U'); put(body, CX - 2, shirtTop + 1, 'n'); put(body, CX - 2, shirtTop + 2, 'n'); put(body, CX + 1, shirtTop + 1, 'n'); put(body, CX + 1, shirtTop + 2, 'n'); rect(body, CX - 3, shirtTop + 4, 6, 1, 'U'); }
  // neckline
  if (bk) { if (!hood && !gi) rect(body, CX - 3, shirtTop, 6, 1, ss); }
  else { rect(body, CX - 2, shirtTop, 4, 1, 'S'); rect(body, CX - 1, shirtTop + 1, 2, 1, 'S'); }
  if (tank && bk) { rect(body, tL, shirtTop, 2, 1, 's'); rect(body, tR - 1, shirtTop, 2, 1, 's'); rect(body, CX - 2, shirtTop, 4, 1, 'S'); rect(body, tL, shirtTop + 3, TW, 1, 'R'); }
  else if (tank) { rect(body, tL, shirtTop, 2, 1, 's'); rect(body, tR - 1, shirtTop, 2, 1, 's'); rect(body, CX - 3, shirtTop, 6, 1, 'S'); rect(body, CX - 2, shirtTop + 1, 4, 1, 'S'); rect(body, tL, shirtTop + 3, TW, 1, 'R'); }
  if (sweater && !bk) { put(body, CX - 2, shirtTop + 2, 'R'); put(body, CX, shirtTop + 2, 'R'); rect(body, CX - 2, shirtTop + 3, 3, 1, 'R'); put(body, CX - 1, shirtTop + 4, 'R'); put(body, CX - 2, shirtTop + 2, 'r'); }
  if (gi) {
    if (bk) { rect(body, CX - 3, shirtTop, 6, 1, 'N'); rect(body, tL, shirtTop + 4, TW, 1, 'E'); }
    else { for (let i = 0; i < 4; i++) { put(body, CX - 3 + i, shirtTop + i, 'N'); put(body, CX + 2 - i, shirtTop + i, 'N'); }
    rect(body, tL, shirtTop + 4, TW, 1, 'E'); put(body, CX - 1, shirtTop + 5, 'E'); put(body, CX, shirtTop + 5, 'E'); }
    for (let y = pantsTop; y < pantsTop + 6; y++) for (let x = 0; x < W; x++) { if (body[y][x] === 'p') body[y][x] = 'n'; else if (body[y][x] === 'q') body[y][x] = 'N'; }
    if (!bk) { put(body, CX - 2, pantsTop, 'E'); put(body, CX - 2, pantsTop + 1, 'E'); put(body, CX + 1, pantsTop, 'E'); }
  }
  }

  // ---- arms: sleeves hug torso, skin part leaves a 1px gap that becomes outline
  const arm = (side) => {
    const sx = side < 0 ? tL - AW - 1 : tR + 2;           // skin arm x
    const slx = side < 0 ? tL - AW - 1 : tR + 1;          // sleeve x
    rect(body, slx, shirtTop, AW + 1, 2, sb);
    rect(body, slx, shirtTop + 1, AW + 1, 1, ss);
    rect(body, sx, shirtTop + 2, AW, 4, 's');
    rect(body, side < 0 ? sx : sx + AW - 1, shirtTop + 2, 1, 4, 'S');
    rect(body, sx, shirtTop + 5, AW, 1, 'S'); // hand shading
  };
  const nArm = (side) => {

    rect(body, sx, shirtTop, AW, 6, 's');

    const bx = side < 0 ? sx - 1 : sx + AW;                             // bicep bulge

  const thick = (x0, y0, x1, y1, w, c) => { const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) || 1; for (let i = 0; i <= n; i++) rect(body, Math.round(x0 + (x1 - x0) * i / n), Math.round(y0 + (y1 - y0) * i / n), w, 1, c); };

      rect(body, fx - 1, shirtTop - 4, AW + 2, 3, 's'); rect(body, fx - 1, shirtTop - 2, AW + 2, 1, 'S');   // fist

    }
  };
  const armPose = { spell: [null, 'up'], spell2: [null, 'up'], wave1: [null, 'wave1'], wave2: [null, 'wave2'], stretch: ['up', 'up'], flex: ['flex', 'flex'], thumb: [null, 'thumb'], shuffleL: ['up', null], shuffleR: [null, 'up'] }[pose] || [null, null];

// ---- drawing
function worldDraw() {
  const g = WR.g, cv = WR.cv, sc = WR.sc, M = WR.maps[WR.cur], p = WR.p;
  const vw = cv.width / sc, vh = cv.height / sc;
  let cx = p.x * WT - vw / 2, cy = p.y * WT - vh / 2;
  cx = M.w * WT <= vw ? (M.w * WT - vw) / 2 : Math.max(0, Math.min(M.w * WT - vw, cx));
  cy = M.h * WT <= vh ? (M.h * WT - vh) / 2 : Math.max(0, Math.min(M.h * WT - vh, cy));
  cx = Math.round(cx * sc) / sc; cy = Math.round(cy * sc) / sc;
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = WR.cur === 'cave' ? '#0c0910' : WR.cur === 'tower' ? '#1a1630' : '#2f6b2a'; g.fillRect(0, 0, cv.width, cv.height);
  g.setTransform(sc, 0, 0, sc, -cx * sc, -cy * sc); g.imageSmoothingEnabled = false;
  g.drawImage(M.bg, 0, 0);
  const draws = [], shadow = (x, y, rx) => { g.fillStyle = 'rgba(20,40,10,.24)'; g.beginPath(); g.ellipse(x, y, rx, 3, 0, 0, 7); g.fill(); };
  M.props.forEach(q => { const a = propCanvas(q); if (!a.c) return; const x = q.x * WT - a.ax, y = q.y * WT - a.ay;
    if (x > cx + vw + 64 || y > cy + vh + 64 || x + a.c.width < cx - 64 || y + a.c.height < cy - 64) return;
    if (q.type === 'lily') { g.drawImage(a.c, x, y); return; }
    if (['tree', 'pine', 'bush', 'house', 'tower', 'well', 'rock'].includes(q.type)) shadow(x + a.ax + (q.type === 'house' ? q.w * 8 : q.type === 'tower' ? 40 : q.type === 'well' ? 16 : 8), y + a.c.height - 2, q.type === 'house' ? q.w * 8 + 4 : q.type === 'tower' ? 44 : q.type === 'well' ? 18 : 9);
    draws.push({ z: y + a.c.height, c: a.c, x, y }); });
  const tnow = performance.now();
  WR.ents.forEach(e => {
    const c = e.npc ? npcCanvas(e.id) : itemCanvas(e.obj), bob = e.pick ? Math.round(Math.sin(tnow / 300) * 1.5) : 0;
    const x = Math.round(e.x * WT + 8 - c.width / 2), y = Math.round((e.y + 1) * WT - c.height - (e.lift || 0)) + bob;
    if (!e.noShadow && !e.flat) shadow(e.x * WT + 8, (e.y + 1) * WT - 2, c.width / 2.6);
    draws.push({ z: e.flat ? (e.y + 1) * WT - 20 : (e.y + 1) * WT, c, x, y, e });
  });
  const st = Math.min(3, tierOf('DIS') + 1), hasDog = S.owned.spirit && S.equip.spirit;
  if (hasDog) { const c = spiritCanvas(st), sx = WR.spirit.x * WT - c.width / 2, sy = WR.spirit.y * WT + 6 - c.height; shadow(WR.spirit.x * WT, WR.spirit.y * WT + 5, c.width / 2.4); draws.push({ z: WR.spirit.y * WT + 6, c, x: Math.round(sx), y: Math.round(sy), flip: WR.spirit.x > p.x }); }
  const side = p.dir >= 2, pose = p.dir === 0 ? (p.moving ? 'back' + (Math.floor(p.t * 7) % 2) : 'back') : !p.moving ? '' : side ? 'run' + (Math.floor(p.t * 12) % 4) : 'walk' + (Math.floor(p.t * 7) % 2);
  WR.frames = WR.frames || {}; const hc = pose ? (WR.frames[pose] || (WR.frames[pose] = heroCanvas(pose))) : WR.hero, hb = /run[13]/.test(pose) ? 1 : 0, flipH = p.moving && p.dir === 3;
  (WR.dust || []).forEach(d => { d.t += 1 / 60; const a = Math.max(0, 1 - d.t / .4), r = 1.5 + d.t * 7; g.fillStyle = `rgba(240,230,210,${a * .7})`; g.beginPath(); g.arc(d.x * WT, d.y * WT, r, 0, 7); g.fill(); }); WR.dust = (WR.dust || []).filter(d => d.t < .4);
  shadow(p.x * WT, p.y * WT + 6, hc.width / 2.8);
  draws.push({ z: p.y * WT + 6, c: hc, x: Math.round(p.x * WT - hc.width / 2), y: Math.round(p.y * WT + 7 - hc.height - hb), flip: flipH });
  draws.sort((a, b) => a.z - b.z).forEach(d => { if (d.flip) { g.save(); g.translate(d.x + d.c.width, d.y); g.scale(-1, 1); g.drawImage(d.c, 0, 0); g.restore(); } else g.drawImage(d.c, d.x, d.y); });
  // quest markers over mentors
  WR.ents.forEach(e => { if (!e.npc || !WQ[e.id]) return; const s = wq(e.id), rt = rlTask(e.id), mark = s === 2 || (rt && rt.done) ? '?' : (s === 0 && didToday()) || rlOffer(e.id) ? '!' : ''; if (!mark) return; const x = e.x * WT + 8, y = (e.y + 1) * WT - 40 + Math.round(Math.sin(tnow / 250) * 1.5);
    g.fillStyle = '#3b2416'; g.fillRect(x - 4, y - 1, 8, 11); g.fillStyle = mark === '?' ? '#7fd7ff' : '#ffd36b'; g.fillRect(x - 3, y, 6, 9); g.fillStyle = '#3b2416'; if (mark === '!') { g.fillRect(x - 1, y + 1, 2, 4); g.fillRect(x - 1, y + 6, 2, 2); } else { g.fillRect(x - 2, y + 1, 4, 1); g.fillRect(x + 1, y + 2, 1, 2); g.fillRect(x - 1, y + 4, 2, 1); g.fillRect(x - 1, y + 6, 2, 2); } });
  // sparkle on things you can pick up
  WR.ents.forEach(e => { if (!e.pick) return; const ph = Math.floor(tnow / 180) % 4, x = e.x * WT + 8 + [-6, 5, -3, 7][ph], y = (e.y + 1) * WT - 14 - (e.lift || 0) + [-2, -6, -9, -4][ph]; g.fillStyle = '#fff6b0'; g.fillRect(x, y - 1, 1, 3); g.fillRect(x - 1, y, 3, 1); });

  if (M.dark) {
    const D = WR.dark || (WR.dark = document.createElement('canvas')); if (D.width !== Math.ceil(vw) + 2) { D.width = Math.ceil(vw) + 2; D.height = Math.ceil(vh) + 2; }
    const d = D.getContext('2d'); d.globalCompositeOperation = 'source-over'; d.clearRect(0, 0, D.width, D.height); d.fillStyle = `rgba(8,4,18,${Math.min(.85, M.dark * 2.2)})`; d.fillRect(0, 0, D.width, D.height); d.globalCompositeOperation = 'destination-out';
    const L = [[p.x * WT, p.y * WT - 4, WR.cur === 'cave' ? 60 : 140]]; M.props.filter(q => q.type === 'crystal' || q.type === 'candle').forEach(q => L.push([q.x * WT + 8, q.y * WT + 8, q.type === 'candle' ? 40 : 26]));
    L.forEach(([x, y, r]) => { const gr = d.createRadialGradient(x - cx, y - cy, 2, x - cx, y - cy, r); gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); d.fillStyle = gr; d.beginPath(); d.arc(x - cx, y - cy, r, 0, 7); d.fill(); });
    g.drawImage(D, cx, cy);
    M.props.filter(q => q.type === 'crystal').forEach(q => { const gr = g.createRadialGradient(q.x * WT + 8, q.y * WT + 8, 1, q.x * WT + 8, q.y * WT + 8, 15); gr.addColorStop(0, 'rgba(127,215,255,.4)'); gr.addColorStop(1, 'rgba(127,215,255,0)'); g.fillStyle = gr; g.fillRect(q.x * WT - 8, q.y * WT - 8, 32, 32); });
  }
}
