<style>
@font-face{font-family:'Press Start 2P';src:url(fonts/press-start-2p.woff2) format('woff2');font-display:swap}
:root{--bg:#6b4527;--panel:#f2d9a1;--field:#fff6dc;--fg:#3b2412;--mid:#6b4423;--hd:#f7e3b0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1a0e;--panel:#cfae6f;--field:#e8d3a0;--hd:#e8c98a}}
:root[data-theme="dark"]{--bg:#2a1a0e;--panel:#cfae6f;--field:#e8d3a0;--hd:#e8c98a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg) repeating-linear-gradient(90deg,transparent 0 46px,rgba(0,0,0,.14) 46px 48px);color:var(--fg);font:10px/1.7 'Press Start 2P',ui-monospace,monospace;image-rendering:pixelated}
main{max-width:480px;margin:0 auto;padding:14px 14px 90px}
h1,h2{color:var(--hd);text-shadow:2px 2px 0 var(--fg)}
h1{font-size:14px;margin:4px 0 12px}
h2{font-size:10px;margin:18px 0 8px}
.box{border:4px solid var(--fg);background:var(--panel);padding:10px;box-shadow:inset 0 0 0 3px #e4b86a,3px 3px 0 rgba(0,0,0,.35)}
button,input,select{font:inherit;color:var(--fg);background:var(--field);border:3px solid var(--fg);padding:8px;border-radius:0}
button{cursor:pointer;box-shadow:2px 2px 0 var(--fg)}
button:active{transform:translate(2px,2px);box-shadow:none}
button:disabled{opacity:.5;cursor:default}
h1{display:flex;justify-content:space-between;align-items:center}
.cog{background:transparent;border:0;box-shadow:none;padding:2px}
.cog svg{width:30px;height:30px;fill:var(--hd);display:block}
@keyframes bob{0%,49%{transform:translateY(0)}50%,100%{transform:translateY(-1px)}}
.bob{animation:bob 1s infinite}
.noanim .bob{animation:none}
@media (prefers-reduced-motion:reduce){.bob{animation:none}}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:96px;padding:8px;border:3px solid var(--fg);background:var(--panel);box-shadow:inset 0 0 0 3px #e4b86a,2px 2px 0 var(--fg);text-align:center}
.glow{background:#ffe27a;color:var(--fg);animation:glow .9s steps(2) infinite;box-shadow:2px 2px 0 var(--fg),0 0 0 4px #f0c030}
@keyframes glow{0%{background:#ffe27a;box-shadow:2px 2px 0 var(--fg),0 0 0 4px #f0c030}50%{background:#fffbe0;box-shadow:2px 2px 0 var(--fg),0 0 0 4px #fff3a0}}
.noanim .glow{animation:none}
@media (prefers-reduced-motion:reduce){.glow{animation:none}}
.tile{position:relative}
.tile:has(> .spk){background:#ffe27a;box-shadow:inset 0 0 0 3px #f0c030,0 0 0 4px #f0c030,2px 2px 0 var(--fg);animation:tileglow .9s steps(2) infinite}
@keyframes tileglow{0%{background:#ffe27a;box-shadow:inset 0 0 0 3px #f0c030,0 0 0 4px #f0c030,2px 2px 0 var(--fg)}50%{background:#fffbe0;box-shadow:inset 0 0 0 3px #fff3a0,0 0 0 4px #fff3a0,2px 2px 0 var(--fg)}}
.noanim .tile:has(> .spk){animation:none}
@media (prefers-reduced-motion:reduce){.tile:has(> .spk){animation:none}}
.boss{position:relative;width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:8px;background:var(--panel);border:4px solid var(--fg);box-shadow:inset 0 0 0 3px #e4b86a,3px 3px 0 rgba(0,0,0,.35)}
.boss .bspr{width:56px;height:56px;flex:none;background:var(--field);border:2px solid var(--fg)}
.boss .bi{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.boss .bi b{font-weight:normal;font-size:9px}
.boss small{font-size:8px;color:var(--mid);line-height:1.5}
.hpbar{display:block;height:10px;border:2px solid var(--fg);background:#5a2a22}
.hpbar i{display:block;height:100%;background:#e05a47;box-shadow:inset 0 2px 0 #ff8a7a;transition:width .4s}
.hpbar.big{width:100%;height:12px}
.hpn{font-size:9px;flex:none}
.boss.beaten .bspr{filter:grayscale(1);opacity:.6}
.boss.beaten .hpn{color:#2f7a1f}
.boss.hurt .bspr{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.dmg{position:absolute;left:30px;top:6px;color:#c23b2c;font-size:11px;text-shadow:1px 1px 0 #fff6dc;animation:gain 1.4s ease-out forwards;pointer-events:none}
.shelf{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;width:100%;padding:6px;background:#8a5a32;border:3px solid var(--fg);box-shadow:inset 0 -4px 0 #6b4423}
.tro{display:flex;flex-direction:column;align-items:center;gap:2px}
.tro .tsp{width:36px;height:36px}
.tro small{font-size:8px;color:#fff1c4}
.tro.none .tsp{filter:brightness(0) opacity(.35)}
.card .bbig{width:128px;height:128px}
.card .gone{filter:grayscale(1);opacity:.6}
.noanim .boss.hurt .bspr{animation:none}
@media (prefers-reduced-motion:reduce){.boss.hurt .bspr{animation:none}.dmg{animation:none}}
.spr{position:relative;flex:none;line-height:0}
.say{position:absolute;top:2px;left:58px;width:max-content;max-width:150px;background:#fffaf0;color:var(--fg);border:3px solid var(--fg);padding:6px 8px;font-size:9px;line-height:1.5;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:3;box-shadow:2px 2px 0 rgba(0,0,0,.3)}
.say.show{opacity:1;transform:none}
.say::after{content:'';position:absolute;left:10px;bottom:-9px;width:6px;height:6px;background:#fffaf0;border:3px solid var(--fg);border-top:0;border-left:0;transform:skewY(45deg)}
@media (prefers-reduced-motion:reduce){.say{transition:none}}
.tw{position:relative;display:flex}
.tw .tile{flex:1}
.ib{position:absolute;top:7px;left:7px;width:26px;height:26px;padding:0;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:1px 1px 0 var(--fg);border-width:2px}
.ovl{position:fixed;inset:0;background:rgba(30,18,8,.6);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.card{width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.card .cpic{width:112px;height:112px;border:3px solid var(--fg);background:var(--field)}
.card h3{margin:0;font-size:12px}
.card small{font-size:9px;color:var(--mid)}
.card p{margin:0}
.card .lbl{margin-top:8px;font-size:9px;color:var(--mid)}
.card button{margin-top:12px;width:100%}
.hb{transform-box:fill-box;transform-origin:50% 60%;animation:beat 4s steps(1) infinite}
@keyframes beat{0%,100%{transform:none}84%{transform:scale(1.12)}88%{transform:none}92%{transform:scale(1.08)}96%{transform:none}}
.noanim .hb{animation:none}
.hb{transition:opacity .3s}.spr:has(.say.show) .hb{opacity:0}
@media (prefers-reduced-motion:reduce){.hb{animation:none}}
.card button.ghost{margin-top:4px;background:transparent;box-shadow:none}
.card .sgpts{color:var(--c)}
.spk{display:inline-block;width:4px;height:4px;background:#f0c030;box-shadow:4px 0 #f0c030,-4px 0 #f0c030,0 4px #f0c030,0 -4px #f0c030;margin:0 8px;animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.noanim .spk{animation:none}
@media (prefers-reduced-motion:reduce){.spk{animation:none}}
.tabs{display:flex;gap:8px;margin:14px 0 10px}
.tabs button{flex:1;background:rgba(0,0,0,.25);color:var(--hd);border-color:var(--fg);box-shadow:none}
.tabs button[aria-pressed="true"]{background:var(--field);color:var(--fg);box-shadow:inset 0 0 0 3px #e4b86a,2px 2px 0 var(--fg)}
.tile svg.qth{background:var(--field)}
.tile[aria-pressed="false"] svg.qth{opacity:.45}
.tabs button{padding:8px 4px}
.tile svg.thumb{width:72px;height:72px;border:2px solid var(--fg)}
.tile svg{width:40px;height:40px}
.tile small{font-size:8px;color:var(--mid)}
.tile.locked{background:var(--bg);box-shadow:none;color:var(--hd);opacity:.7}
.tile.locked b{font-size:20px}
:focus-visible{outline:3px dashed var(--fg);outline-offset:2px}
.hero{display:flex;gap:12px;align-items:center}
svg.sprite{width:150px;height:150px;flex:none;border:3px solid var(--fg)}
.stats{flex:1;display:grid;gap:10px}
.s-STR{--c:#c0392b}.s-INT{--c:#2f6fd0}.s-CHA{--c:#d9658f}.s-DIS{--c:#3f9b3f}
.stat .row{display:flex;justify-content:space-between}
.seg{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;margin:3px 0}
.seg i{height:9px;border:2px solid var(--fg);background:var(--field)}
.seg i.on{background:var(--c)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:15px;padding:0 2px;margin-left:5px;border:2px solid var(--fg);font-size:8px;font-weight:normal;vertical-align:middle;background:var(--field)}
.tier1 .badge{background:#d58b4a}.tier2 .badge{background:#c9d1da}.tier3 .badge,.tier4 .badge{background:#e8bf4f}
.tier4 .badge{box-shadow:0 0 0 2px #fff1a8}
.tier1 .seg i{border-color:#a0612a}.tier2 .seg i{border-color:#8f9aa6}.tier3 .seg i,.tier4 .seg i{border-color:#b8860b}
.trial{font-size:8px;line-height:1.5;color:#8a6200;background:none;border:0;box-shadow:none;padding:2px 0;width:100%;text-align:left;display:flex;align-items:center;gap:0}
.trial .ti{margin-left:auto;width:14px;height:14px;border:2px solid #8a6200;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:normal}
.tbox{display:flex;gap:4px;justify-content:center;margin:4px 0}.tbox i{width:26px;height:26px;border:3px solid var(--fg);background:var(--field);display:flex;align-items:flex-end;justify-content:center}.tbox i.on{background:var(--c)}.tbox i.pre{opacity:.35}.tbox u{text-decoration:none;font-size:8px;margin-bottom:-18px;color:var(--mid)}.tbox:not(.cnt){margin-bottom:16px}
.lock{display:inline-block;width:7px;height:7px;background:#8a6200;margin-right:4px;vertical-align:baseline}
.prog{height:6px;background:var(--field);border:2px solid var(--fg)}
.prog b{display:block;height:100%;background:var(--c)}
.task{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:2px dashed var(--mid);position:relative;transition:opacity .35s}
.task.won{background:#cfe9a6;box-shadow:-8px 0 0 #cfe9a6,8px 0 0 #cfe9a6}
.task.won .chk{background:#4caf50!important;color:#fff;opacity:1}
.task.leaving{opacity:0}
.gain{position:absolute;right:46px;top:50%;font-size:10px;color:#2f7a1f;text-shadow:1px 1px 0 #fff6dc;white-space:nowrap;pointer-events:none;animation:gain 1.6s ease-out forwards}
@keyframes gain{0%{opacity:0;transform:translateY(-20%)}15%{opacity:1;transform:translateY(-60%)}75%{opacity:1;transform:translateY(-90%)}100%{opacity:0;transform:translateY(-140%)}}
.noanim .gain{animation:none;transform:translateY(-50%)}
@media (prefers-reduced-motion:reduce){.gain{animation:none;transform:translateY(-50%)}.task{transition:none}}
.task:last-child{border:0}
.task .n{flex:1;word-break:break-word}
.task small{display:block;font-size:9px;color:var(--mid)}
.trhead{width:100%;display:flex;align-items:center;gap:10px;text-align:left;color:var(--fg);background:#e8c98a;border:3px solid var(--fg);box-shadow:2px 2px 0 var(--fg);padding:8px 10px;margin:8px 0}
.task.trhead,.task.trhead:last-child{border:3px solid var(--fg)}
.trhead .arw{width:14px;height:18px;flex:none;fill:var(--fg);transition:transform .15s}
.trhead[aria-expanded="true"] .arw{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){.trhead .arw{transition:none}}
.trsum{display:flex;align-items:center;justify-content:center;border:3px solid var(--fg);font-size:10px}
.task.sub{padding-left:12px;border-left:4px solid var(--mid)}
.chk{width:34px;height:34px;padding:0;flex:none;background:#8fcf6a}
.x{padding:4px 7px;flex:none;box-shadow:none}
.qb{flex:none;width:36px;height:36px;padding:3px;box-shadow:1px 1px 0 var(--fg);border-width:2px;display:flex;align-items:center;justify-content:center}.qb svg{width:26px;height:26px}
.edt{flex:none;border:2px solid var(--fg);padding:3px 5px;font-size:8px;color:var(--fg)}
.card .danger{color:#a8263f}
body.inworld main{max-width:none;padding:0}
#wv{position:fixed;left:0;right:0;top:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));background:#2f6b2a;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wc{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}

.fxtier .hfport{display:flex;gap:6px;justify-content:center;align-items:flex-end}
body.wlock nav button{pointer-events:none;opacity:.45}
.pbig{width:144px;height:auto;image-rendering:pixelated;display:block;margin:4px auto}.gtent{width:168px;height:auto;image-rendering:pixelated;display:block;margin:6px auto}.wglove{width:56px;image-rendering:pixelated;display:block;margin:10px auto;animation:wflash2 .8s steps(2) infinite}
.pgal .pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.pgal .pcell{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}.pgal .pcell b{font-size:6px;font-weight:normal;text-align:center}.pgal .pcell small{font-size:7px;color:var(--mid)}

.bkst{display:grid;grid-template-columns:1fr 1fr;gap:6px}.bkst span{display:flex;align-items:center;gap:6px;border:2px solid var(--fg);background:var(--field);padding:5px 6px}.bkst b{width:9px;height:9px;flex:none;background:var(--c);border:2px solid var(--fg)}.bkst i{font-style:normal;margin-left:auto}

.warnbar{width:100%;max-width:330px;background:#b3261e;color:#fff1e8;border:4px solid #3b0d0a;box-shadow:0 0 0 3px #ff6b5a;padding:16px 10px;text-align:center;font-size:13px;line-height:2;animation:wflash .5s steps(2) infinite,shake .35s steps(4) 4}
.warn .tap{color:#ffd6cf;margin-top:18px;font-size:10px;animation:wflash2 1.2s steps(2) infinite}
@keyframes wflash{50%{background:#6e120e;box-shadow:0 0 0 3px #b3261e}}
@keyframes wflash2{50%{opacity:.35}}
@keyframes shake{0%,100%{transform:none}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,-2px)}}
.card.bossin{border-color:#3b0d0a;box-shadow:inset 0 0 0 3px #b3261e,0 0 0 3px #b3261e,3px 3px 0 rgba(0,0,0,.35);animation:bdrop .4s steps(5)}
.card.bossin .bnew{color:#b3261e;font-size:10px}
@keyframes bdrop{from{transform:translateY(-70px);opacity:0}to{transform:none;opacity:1}}
.noanim .warnbar,.noanim .warn .tap,.noanim .bossin{animation:none}
@media (prefers-reduced-motion:reduce){.warnbar,.warn .tap,.bossin{animation:none}}

.help{padding:6px 12px}.help section{padding:10px 0;border-bottom:2px dashed var(--mid)}.help section:last-child{border:0}.help h3{margin:0 0 6px;font-size:10px}.help ul{margin:0;padding:0;list-style:none}.help li{position:relative;padding-left:14px;margin:5px 0;font-size:9px;line-height:1.9}.help li::before{content:'';position:absolute;left:0;top:5px;width:6px;height:6px;background:var(--mid)}.help b{font-weight:normal;color:var(--mid)}
.sqt{display:flex;justify-content:space-between;align-items:center;background:var(--field);color:var(--fg);box-shadow:none}
.sw{display:block;position:relative;width:40px;height:20px;border:3px solid var(--fg);background:#d9c9a3;flex:none}.sw b{position:absolute;top:2px;left:2px;width:10px;height:10px;background:var(--fg);transition:left .15s}.sqt.on .sw{background:#8fcf6a}.sqt.on .sw b{left:22px}
@media (prefers-reduced-motion:reduce){.sw b{transition:none}}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:4px solid var(--fg);box-shadow:inset 0 3px 0 #e4b86a;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;box-shadow:none;background:transparent;color:var(--hd);padding:14px 0}
nav button[aria-current="true"]{background:var(--panel);color:var(--fg)}
.add{display:grid;gap:8px}
.sug{display:flex;flex-wrap:wrap;gap:8px}
.sug button{font-size:9px;text-align:left}
.empty{color:var(--mid)}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--fg);color:var(--hd);padding:8px 12px;display:none;z-index:9;max-width:92%}

['Spike harder!','Monsterblock!','Leg day?','One more chapter','Running is cheaper than therapy',"Let's grind",'Small steps, big gains','You showed up. That counts.'].forEach(x=>L.push(x));

if(h>=22||h<4)L.push('Late night grind?','Sleep is a stat too');
const today=S.log.filter(e=>day(e.t)===day()).length;if(h>=17&&today)P.push('Nice work today');

if(S.log.some(e=>e.id==1005&&wk(e.t)===w))P.push('Food prep done!');
{const bs=boss();if(bs.won)P.push('Boss defeated!');else if(bs.dealt>0)P.push(bs.b.name+': '+bs.left+' HP left!')}

function weekNo(d){const x=new Date(d||Date.now());x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return Math.round(x.getTime()/6048e5)}
function boss(){const b=BOSSES[((weekNo()%BOSSES.length)+BOSSES.length)%BOSSES.length],w=wk();
const dealt=S.log.filter(e=>wk(e.t)===w).reduce((a,e)=>a+b.dmg(e),0);return{b,w,dealt,left:Math.max(0,b.hp-dealt),won:!!(S.bossWon&&S.bossWon[w])}}

function bnote(f,d,t,type,vol){if(!S.settings.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),a=AC.currentTime+t;o.type=type||'square';o.frequency.value=f;g.gain.setValueAtTime(vol||.04,a);g.gain.setValueAtTime(0,a+d);o.connect(g);g.connect(AC.destination);o.start(a);o.stop(a+d+.02);bossNotes.push(o)}catch(e){}}

bnote(82.41,.5,0,'sawtooth',.06);bnote(41.2,.5,0,'square',.05);                       // opening hit
for(let rep=0;rep<2;rep++){const o=.6+rep*bar*4;BASS.forEach((b,i)=>b.forEach((f,j)=>bnote(f,st*.8,o+i*bar+j*st,'triangle',.09)));
LEAD.forEach((l,i)=>{let t=o+i*bar;l.forEach(([f,d])=>{bnote(f,d*.9,t,'square',.035);t+=d})})}

    const step = () => {

    };

// ===================== Grindlife World — art v2 =====================
// Ground is painted pixel by pixel once; props (trees, houses, tower...) and characters are
// separate sprites drawn in depth order, so you can walk behind trees and roofs.
const WT = 16;
const hsh = (x, y, k = 0) => (((x * 73856093) ^ (y * 19349663) ^ (k * 83492791)) >>> 0);
const vnoise = (x, y, s, k = 0) => {                       // smooth value noise for big grass patches

};
const CL = {

  p0: '#dcc08a', p1: '#cfae74', p2: '#e8d4a4', pE: '#b8955c',                             // dirt path
  s0: '#b7b0a3', s1: '#cdc7bb', s2: '#968f82', sG: '#7f786c',                             // cobbles
  w0: '#3f9fd0', w1: '#56b3e0', w2: '#2f86b8', wF: '#d8f1fb', wS: '#7fcbe8',              // water
  r0: '#8d887e', r1: '#a49f94', r2: '#6f6b62', r3: '#5a564e', rF: '#7a756b',              // rock
  m0: '#aa9f88', m1: '#978c74', m2: '#bdb39b',                                            // mountain dirt

// ---------------- maps ----------------
function makeMap(w, h, fill) { return { w, h, g: Array.from({ length: h }, () => Array(w).fill(fill)), solid: Array.from({ length: h }, () => Array(w).fill(0)), props: [], warps: [] }; }

function buildVillage() {

  box(16, 1, 8, 3, 'K'); box(19, 4, 2, 4, 'M'); box(19, 8, 2, 2, 'P');
  // square + north road
  box(19, 10, 2, 4, 'P'); box(15, 14, 10, 6, 'S');
  // east: road, gym, rock hill with the cave mouth on its south face
  box(25, 16, 12, 2, 'P'); box(28, 11, 5, 4, 'G');
  box(33, 7, 6, 9, 'R'); box(35, 15, 1, 1, 'E');           // E = cave mouth
  // west: road to the tower
  box(5, 16, 10, 2, 'P'); box(5, 15, 1, 1, 'P');
  // south: road, bakery yard, garden, pond road
  box(19, 20, 2, 11, 'P'); box(16, 26, 3, 1, 'P'); box(21, 26, 7, 1, 'P'); box(22, 27, 6, 3, 'F'); box(10, 28, 9, 2, 'P');
  box(4, 25, 6, 6, 'W'); box(3, 26, 1, 4, 'W'); box(10, 26, 1, 2, 'W');
  for (let y = 0; y < M.h; y++) for (let x = 0; x < M.w; x++) if ('RWF'.includes(M.g[y][x]) && M.g[y][x] !== 'E') M.solid[y][x] = 1;
  // props (footprints become solid)
  box(0, 16, 5, 2, 'P'); box(5, 22, 4, 1, 'P'); box(8, 18, 1, 4, 'P');
  box(36, 18, 1, 7, 'P'); box(33, 24, 4, 1, 'P');                                        // path to the circus tent                  // road west into the woods, path to the plot
  const keep = (x, y) => (x <= 1 && (y === 16 || y === 17)) || (x >= 2 && x <= 8 && y >= 18 && y <= 22);
  const tree = (x, y, kind) => { if (keep(x, y)) return; prop(kind || (hsh(x, y) % 4 === 0 ? 'pine' : 'tree'), x, y); block(x, y, 1, 1); };
  for (let x = 0; x < M.w; x++) { tree(x, M.h - 1); if (hsh(x, 7) % 2) tree(x, M.h - 2); if (x < 11 || x > 28) { tree(x, 0); } }
  for (let y = 1; y < M.h - 2; y++) { tree(0, y); tree(M.w - 1, y); if (hsh(3, y) % 3 === 0 && y > 3) tree(1, y); if (hsh(5, y) % 3 === 0 && y > 3 && (y < 6 || y > 18)) tree(M.w - 2, y); }
  [[3, 4], [6, 2], [8, 6], [4, 8], [31, 3], [35, 2], [30, 6], [36, 5], [13, 22], [9, 22], [30, 25], [31, 29], [11, 9], [29, 9], [35, 26], [4, 21], [2, 13], [37, 20], [26, 31], [15, 31]].forEach(([x, y]) => tree(x, y));

  for (let x = 21; x < 29; x++) prop('fence', x, 30, { h: 1 }); prop('fence', 21, 27, { v: 1 }); prop('fence', 21, 28, { v: 1 }); prop('fence', 21, 29, { v: 1 }); prop('fence', 28, 27, { v: 1 }); prop('fence', 28, 28, { v: 1 }); prop('fence', 28, 29, { v: 1 });

function buildTower() {
  const M = makeMap(11, 9, 'x'), { box, block, prop } = mapTools(M);
  for (let x = 0; x < 11; x++) { M.g[0][x] = 'X'; M.g[1][x] = 'X'; M.g[8][x] = 'X'; } for (let y = 0; y < 9; y++) { M.g[y][0] = 'X'; M.g[y][10] = 'X'; }

  [1, 2, 7, 8].forEach(x => { prop('shelf', x, 1); block(x, 2, 1, 1); });
  prop('table', 5, 3); block(5, 3, 1, 1); prop('starwin', 5, 0); prop('candle', 1, 6); block(1, 6, 1, 1); prop('candle', 9, 6); block(9, 6, 1, 1); prop('globe', 9, 3); block(9, 3, 1, 1);

function buildCave() {
  const M = makeMap(12, 9, 'c'), { block, prop } = mapTools(M);
  for (let y = 0; y < 9; y++) for (let x = 0; x < 12; x++) { const edge = x === 0 || x === 11 || y === 0 || y === 8 || (y === 1 && hsh(x, 1) % 2) || (x === 1 && hsh(1, y) % 2) || (x === 10 && hsh(10, y) % 2); if (edge) { M.g[y][x] = 'Y'; M.solid[y][x] = 1; } }

function buildForest() {
  const M = makeMap(30, 24, '.'), { set, box, block, prop } = mapTools(M); M.forest = 1;
  // paths: east entrance -> bridge -> camp; branches north-west (toolbox), north-east (feather), south (glade)
  box(21, 11, 9, 2, 'P'); box(13, 11, 6, 2, 'P');
  box(12, 4, 2, 9, 'P'); box(6, 4, 6, 2, 'P');
  box(24, 5, 2, 6, 'P');
  box(12, 13, 2, 6, 'P'); box(10, 17, 2, 2, 'P');
  // the stream runs north-south, crossed by a log bridge
  for (let y = 0; y < M.h; y++) { const sx = 19 + (y > 15 ? 1 : 0) - (y < 5 ? 1 : 0); set(sx, y, 'W'); set(sx + 1, y, 'W'); }

  for (let y = 0; y < M.h; y++) for (let x = 0; x < M.w; x++) if (M.g[y][x] === 'W') M.solid[y][x] = 1;
  M.solid[11][19] = M.solid[12][19] = M.solid[11][20] = M.solid[12][20] = 0;
  prop('bridge', 19, 11);

  for (let y = 0; y < M.h; y++) for (let x = 0; x < M.w; x++) {            // thick edge of trees (open on the east path)
    if (M.g[y][x] === 'W' || (x === M.w - 1 && (y === 11 || y === 12))) continue;
    const edge = x === 0 || y === 0 || x === M.w - 1 || y === M.h - 1 || ((x === 1 || y === 1 || x === M.w - 2 || y === M.h - 2) && hsh(x, y, 3) % 2);

    const h = hsh(x, y, 21) % 100;
    if (h < 34) tree(x, y, h < 8 ? 'oak' : h < 20 ? 'pine' : 'tree');

  prop('log', 15, 8); block(15, 8, 2, 1);
  prop('oak', 7, 12); block(7, 12, 1, 1);
  [[16, 13], [9, 13], [10, 6], [17, 10]].forEach(([x, y]) => prop('fern', x, y));
  [[15, 14], [8, 10]].forEach(([x, y]) => prop('mush', x, y));
  // glade dressing
  [[2, 17], [6, 16], [7, 20], [5, 21], [2, 21], [7, 17]].forEach(([x, y]) => prop('flowers', x, y));
  prop('oak', 8, 16); block(8, 16, 1, 1); prop('mush', 4, 21); prop('stump', 8, 21); block(8, 21, 1, 1);
  [[22, 3], [26, 8], [16, 19], [23, 18], [4, 7]].forEach(([x, y]) => { if (!M.solid[y][x] && M.g[y][x] === '.') prop('flowers', x, y); });

  M.warps.push({ x: 29, y: 11, to: 'village', tx: 1, ty: 16 }, { x: 29, y: 12, to: 'village', tx: 1, ty: 17 });

  pip: [['Share a favorite song with a friend', 3, 'CHA'], ['Listen to a whole album, start to finish', 2, 'INT'], ['Sing or dance to a song you love', 2, 'CHA'], ['Write a short poem', 3, 'INT'], ['Send someone a song that reminds you of them', 3, 'CHA'], ['Hum a tune while you do the dishes', 2, 'CHA']]

  if ((WS().seen.wren || 0) >= 5 && wrenStage() >= 3) { const h = hsh(dn(), 61); if (h % 3 === 0) { const sp = [[16, 19], [13, 27], [26, 25]][(h >> 4) % 3]; return { map: 'village', x: sp[0], y: sp[1] }; } }

function cineTick(now) {

      g.fillStyle = '#d6453a'; g.fillRect(x - 4, y - 5 - f % 2, 8, 6); g.fillStyle = '#ff9f3b'; g.fillRect(x - 3 + (f === 1 ? 1 : 0), y - 8 - (f === 2 ? 1 : 0), 5, 8); g.fillStyle = '#ffd36b'; g.fillRect(x - 1 - (f === 2 ? 1 : 0), y - 6 - f, 3, 5); g.fillStyle = '#fff6b0'; g.fillRect(x, y - 3, 1, 2); }

  });

  // sparkle on things you can pick up
  WR.ents.forEach(e => { if (!e.pick) return; const ph = Math.floor(tnow / 180) % 4, x = e.x * WT + 8 + [-6, 5, -3, 7][ph], y = (e.y + 1) * WT - 14 - (e.lift || 0) + [-2, -6, -9, -4][ph]; g.fillStyle = '#fff6b0'; g.fillRect(x, y - 1, 1, 3); g.fillRect(x - 1, y, 3, 1); });

    const D = WR.dark || (WR.dark = document.createElement('canvas')); if (D.width !== Math.ceil(vw) + 2) { D.width = Math.ceil(vw) + 2; D.height = Math.ceil(vh) + 2; }
    const d = D.getContext('2d'); d.globalCompositeOperation = 'source-over'; d.clearRect(0, 0, D.width, D.height); d.fillStyle = `rgba(8,4,18,${Math.min(.85, M.dark * 2.2)})`; d.fillRect(0, 0, D.width, D.height); d.globalCompositeOperation = 'destination-out';
    const L = [[p.x * WT, p.y * WT - 4, WR.cur === 'cave' ? 60 : 140]]; if (M.tent) L.push([6.5 * WT, 4 * WT, boss().won ? 50 : 95]); M.props.filter(q => q.type === 'crystal' || q.type === 'candle').forEach(q => L.push([q.x * WT + 8, q.y * WT + 8, q.type === 'candle' ? 40 : 26]));
    L.forEach(([x, y, r]) => { const gr = d.createRadialGradient(x - cx, y - cy, 2, x - cx, y - cy, r); gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); d.fillStyle = gr; d.beginPath(); d.arc(x - cx, y - cy, r, 0, 7); d.fill(); });
    g.drawImage(D, cx, cy);
    if (M.tent && !boss().won) { const gr = g.createRadialGradient(6.5 * WT, 4.5 * WT, 4, 6.5 * WT, 4.5 * WT, 60); gr.addColorStop(0, 'rgba(255,236,170,.22)'); gr.addColorStop(1, 'rgba(255,236,170,0)'); g.fillStyle = gr; g.fillRect(0, 0, M.w * WT, M.h * WT); }
    M.props.filter(q => q.type === 'crystal').forEach(q => { const gr = g.createRadialGradient(q.x * WT + 8, q.y * WT + 8, 1, q.x * WT + 8, q.y * WT + 8, 15); gr.addColorStop(0, 'rgba(127,215,255,.4)'); gr.addColorStop(1, 'rgba(127,215,255,0)'); g.fillStyle = gr; g.fillRect(q.x * WT - 8, q.y * WT - 8, 32, 32); });
  }
  circusDraw(g, performance.now()); famDrawKey(g, tnow);
